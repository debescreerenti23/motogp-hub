<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGP Hub | Clasificación Top 10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body class="pb-24">

    <!-- Cabecera -->
    <header class="bg-slate-900/90 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-red-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                </span>
                <h1 class="text-xl font-black italic tracking-tighter uppercase">MotoGP <span class="text-red-600">Hub</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <div class="bg-red-600 w-2 h-2 rounded-full"></div>
                </span>
                <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Live 2026</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-8">
        
        <!-- DASHBOARD -->
        <div id="dashboard" class="tab-content active space-y-8">
            <div class="relative overflow-hidden rounded-3xl bg-slate-900 border border-white/5 p-8 shadow-2xl">
                <div class="absolute inset-0 bg-gradient-to-br from-red-600/20 via-transparent to-slate-950"></div>
                <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div>
                        <span class="bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded tracking-widest uppercase">Siguiente Carrera</span>
                        <h2 class="text-4xl font-black italic uppercase mt-2 tracking-tighter">GP de España</h2>
                        <p class="text-slate-400 text-sm mt-1 italic font-medium">Circuito de Jerez-Ángel Nieto | 24 - 26 Abr</p>
                    </div>
                    <div class="text-right bg-black/40 p-4 rounded-2xl backdrop-blur-md border border-white/5">
                        <div id="countdown" class="text-3xl font-mono font-black text-white italic">00d : 00h : 00m : 00s</div>
                        <p class="text-[10px] text-red-500 uppercase font-black tracking-widest mt-1">Tiempo Restante</p>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-xl font-black italic uppercase flex items-center gap-2 tracking-tighter">
                    <span class="w-8 h-1 bg-red-600"></span>
                    Top 5
                </h3>
                <div id="top10-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>

        <!-- RANKING -->
        <div id="ranking" class="tab-content space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h2 class="text-2xl font-black italic uppercase tracking-tighter">Clasificación Mundial</h2>

            </div>
            
            <div class="bg-slate-900 rounded-3xl border border-white/10 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-800 text-[10px] font-black text-slate-400 uppercase tracking-wider">
                            <tr id="ranking-header">
                                <th class="p-4 sticky-col z-30 min-w-[200px]">Piloto / País</th>
                                <th class="p-4 text-center bg-red-600 text-white sticky right-0 z-30">Total</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-body" class="divide-y divide-white/5 text-xs font-medium">
                            <!-- Dinámico -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- CALENDARIO -->
        <div id="calendar" class="tab-content space-y-6">
            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Calendario Oficial 2026</h2>
            <div id="rounds-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Dinámico -->
            </div>
        </div>

        <!-- EQUIPOS -->
        <div id="teams" class="tab-content">
            <h2 class="text-2xl font-black italic uppercase mb-6 tracking-tighter text-white">Equipos MotoGP 2026</h2>
            <div id="teams-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dinámico -->
            </div>
        </div>

    </main>

    <!-- Navegación -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-lg bg-slate-900/90 backdrop-blur-2xl border border-white/10 rounded-full shadow-2xl z-50">
        <div class="flex justify-around items-center h-16 px-4">
            <button onclick="showTab('dashboard')" class="nav-btn active flex flex-col items-center w-full transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                <span class="text-[8px] mt-1 uppercase font-black tracking-widest">Inicio</span>
            </button>
            <button onclick="showTab('ranking')" class="nav-btn flex flex-col items-center w-full transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
                <span class="text-[8px] mt-1 uppercase font-black tracking-widest">Ranking</span>
            </button>
            <button onclick="showTab('calendar')" class="nav-btn flex flex-col items-center w-full transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span class="text-[8px] mt-1 uppercase font-black tracking-widest">Rounds</span>
            </button>
            <button onclick="showTab('teams')" class="nav-btn flex flex-col items-center w-full transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="19" cy="11" r="3"/></svg>
                <span class="text-[8px] mt-1 uppercase font-black tracking-widest">Parrilla</span>
            </button>
        </div>
    </nav>

    <script src="main.js"></script>
    <script src="footer.js"></script>
</body>
</html>
